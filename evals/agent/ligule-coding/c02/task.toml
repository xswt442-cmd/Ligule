artifacts = ["/app/src/server.mjs", "/app/test/server.test.mjs"]

version = "1.0"

[metadata]
author_name = "Ligule"
author_email = "maintainers@invalid"
difficulty = "easy"
category = "software-engineering"
tags = ["ligule-coding", "cross-file", "http-route"]
expert_time_estimate_min = 8.0
junior_time_estimate_min = 15.0

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["registry.npmjs.org", "nodejs.org", "cdn.sheetjs.com", "mirrors.tuna.tsinghua.edu.cn"]
workdir = "/app"
cpus = 1
memory = "2G"
storage = "10G"
